name: wearer_link
description: >-
  Connect a Flutter phone app with its wearable companion (Wear OS / watchOS):
  bidirectional messaging, synced data, background delivery while the app is
  not running, and mutual app launch where the platform allows it.
version: 0.8.2
homepage: https://github.com/Crdzbird/wearer_link
repository: https://github.com/Crdzbird/wearer_link
issue_tracker: https://github.com/Crdzbird/wearer_link/issues
topics:
  - wearable
  - wear-os
  - watchos
  - watch
  - connectivity

environment:
  sdk: ^3.9.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^26.0.1

flutter:
  plugin:
    platforms:
      android:
        package: com.crdzbird.wearer_link
        pluginClass: WearerLinkPlugin
      ios:
        pluginClass: WearerLinkPlugin
