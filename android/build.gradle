group = "com.crdzbird.wearer_link"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.crdzbird.wearer_link"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    buildFeatures {
        // wear.xml capability resource must merge into the consuming app.
        androidResources = true
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    // Pinned to the current stable releases (verified compiling 2026-08-23).
    implementation("com.google.android.gms:play-services-wearable:20.0.1")
    implementation("androidx.wear:wear-remote-interactions:1.2.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")
    // Task.await() extensions for Play Services.
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0")
    // ListenableFuture.await() for RemoteActivityHelper.
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.11.0")
    // Surface-update requesters, compileOnly on purpose: only a Wear OS app
    // that actually ships a tile / complication already depends on these;
    // phone apps must not inherit them. requestSurfaceUpdate() degrades to
    // a typed 'unsupported' error when they are absent at runtime.
    compileOnly("androidx.wear.tiles:tiles:1.6.2")
    compileOnly("androidx.wear.watchface:watchface-complications-data-source:1.3.0")
}
